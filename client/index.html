<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#FAFAF8" />

    <!-- Primary Meta Tags -->
    <title>Samudra-Alert - Real-Time Hazard Platform</title>
    <meta name="title" content="Samudra-Alert - Real-Time Hazard Platform" />
    <meta name="description" content="National community alert platform. Report floods, fires, outages and other incidents, get verified alerts for your area, and stay safe with real-time updates across India." />
    <meta name="keywords" content="community alerts, incident reporting, flood alert, disaster management, civic incidents, safety alerts, India alerts" />
    <meta name="author" content="Samudra-Alert Team" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://samudra-alert.vercel.app/" />
    <meta property="og:title" content="Samudra-Alert - Real-Time Hazard Platform" />
    <meta property="og:description" content="National community alert platform. Report incidents, get verified alerts for your area, and stay safe with real-time updates across India." />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:site_name" content="Samudra-Alert" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://samudra-alert.vercel.app/" />
    <meta property="twitter:title" content="Samudra-Alert - Real-Time Hazard Platform" />
    <meta property="twitter:description" content="National community alert platform. Report incidents, get verified alerts for your area, and stay safe with real-time updates across India." />
    <meta property="twitter:image" content="/og-image.png" />

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      </div>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
